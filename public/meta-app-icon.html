<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Studio Meta App Icon</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f8; color: #25243a; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 440px); text-align: center; }
    img { display: block; width: min(100%, 320px); height: auto; margin: 0 auto 22px; }
    button { border: 0; border-radius: 24px; padding: 12px 20px; color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); font: inherit; font-weight: 650; cursor: pointer; }
    #status { min-height: 1.5em; color: #68677a; }
  </style>
</head>
<body>
  <main>
    <img id="icon" alt="Social Studio speech bubble and sparkle app icon" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiM3QzNBRUQiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiMzQjgyRjYiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB4PSIxNiIgeT0iMTYiIHdpZHRoPSI0ODAiIGhlaWdodD0iNDgwIiByeD0iMTEyIiBmaWxsPSJ1cmwoI2cpIi8+PHBhdGggZD0iTTEyOCAxNDBRMTI4IDEwMCAxNjggMTAwTDM0NCAxMDBRMzg0IDEwMCAzODQgMTQwTDM4NCAyOTZRMzg0IDMzNiAzNDQgMzM2TDIzMiAzMzZMMTY4IDQwMEwxNjggMzM2UTEyOCAzMzYgMTI4IDI5NloiIGZpbGw9IiNmZmYiLz48cGF0aCBkPSJNMjU2IDE2MEwyNjggMjE4TDMzNiAyMzBMMjY4IDI0MkwyNTYgMzAwTDI0NCAyNDJMMTg2IDIzMEwyNDQgMjE4WiIgZmlsbD0idXJsKCNnKSIvPjxwYXRoIGQ9Ik0zNDAgMTQwTDM0NSAxNThMMzYzIDE2M0wzNDUgMTY4TDM0MCAxODZMMzM1IDE2OEwzMTcgMTYzTDMzNSAxNThaIiBmaWxsPSIjQTc4QkZBIi8+PC9zdmc+">
    <h1>Social Studio app icon</h1>
    <p>This utility exports the existing icon as a 1024 × 1024 PNG.</p>
    <button id="download" type="button">Download PNG</button>
    <p id="status" role="status">Preparing the PNG…</p>
    <canvas id="canvas" width="1024" height="1024" hidden></canvas>
  </main>
  <script>
    const image = document.getElementById('icon');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const download = document.getElementById('download');
    function exportPng() {
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, 1024, 1024);
      context.drawImage(image, 0, 0, 1024, 1024);
      canvas.toBlob((blob) => {
        if (!blob) { status.textContent = 'PNG export failed. Try a current version of Chrome or Edge.'; return; }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'social-studio-meta-app-icon-1024.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        status.textContent = 'Downloaded: social-studio-meta-app-icon-1024.png';
      }, 'image/png');
    }
    download.addEventListener('click', exportPng);
    image.addEventListener('load', exportPng, { once: true });
    if (image.complete) exportPng();
  </script>
</body>
</html>

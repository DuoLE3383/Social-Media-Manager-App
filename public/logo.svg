<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6FF0"/>
      <stop offset="55%" stop-color="#6158D9"/>
      <stop offset="100%" stop-color="#4736A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E0FF"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1B1150" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square app-icon background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <!-- subtle top rim light -->
  <path d="M132 16 h248 a116 116 0 0 1 112 92 h-472 a116 116 0 0 1 112 -92 z" fill="#FFFFFF" opacity="0.08"/>

  <!-- orbit ring: conveys "social / sharing" -->
  <ellipse cx="256" cy="268" rx="168" ry="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="10"
           stroke-linecap="round" stroke-dasharray="740 90" transform="rotate(-18 256 268)"/>
  <circle cx="120" cy="176" r="17" fill="#FFC85C"/>
  <circle cx="404" cy="352" r="13" fill="#7CE3C4"/>

  <!-- main four-point AI sparkle -->
  <g filter="url(#softShadow)">
    <path d="M256 118
             C 269 205, 307 243, 394 256
             C 307 269, 269 307, 256 394
             C 243 307, 205 269, 118 256
             C 205 243, 243 205, 256 118 Z"
          fill="url(#sparkGrad)"/>
  </g>
  <!-- secondary mini sparkle -->
  <path d="M368 108
           C 372 134, 384 146, 410 150
           C 384 154, 372 166, 368 192
           C 364 166, 352 154, 326 150
           C 352 146, 364 134, 368 108 Z"
        fill="#FFC85C" opacity="0.95"/>
</svg>
